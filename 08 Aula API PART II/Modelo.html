    <script>
			function getDadosPorID(ex1) {
				let url = 'https://jsonplaceholder.typicode.com/users/'+ex1

				let xmlHttp = new XMLHttpRequest()
				xmlHttp.open('GET', url)

				xmlHttp.onreadystatechange = () => {
					if(xmlHttp.readyState == 4 && xmlHttp.status == 200) {
						let dadosJSONText = xmlHttp.responseText
						let dadosJSONObj = JSON.parse(dadosJSONText)

						document.getElementById('name').value = dadosJSONObj.name

            document.getElementById('email').value = dadosJSONObj.email
						
            document.getElementById('username').value = dadosJSONObj.username
						
            document.getElementById('rua').value = dadosJSONObj.address.street
						
            document.getElementById('cidade').value = dadosJSONObj.address.city
					
						
					}
				}
        xmlHttp.send()
			
          
			}

		</script>
