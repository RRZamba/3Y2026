<?php
// Inicializando as var.
$id = '';
$nome = '';
$email = '';
$username = '';
$rua = '';
$cidade = '';

// Verificando se o ID foi enviado via formulário (GET)
if (isset($_GET['id']) && !empty($_GET['id'])) 
{
    
    // URL da API JSONPlaceholder usando o ID 
    $url = "https://jsonplaceholder.typicode.com/users/" . $id;
    
    // Faz a requisição para a API
    $response = @file_get_contents($url);

	//Se se retornar valores
    if ($response != false) 
	{
        // Transformando o JSON retornado em um array
        $usuario = json_decode($response, true);
        
        // Verifica se a API retornou um usuário válido
        if (!empty($usuario)) 
		{
            $nome = $usuario['name'];
            $email = $usuario['email'];
            $username = $usuario['username'];
            $rua = $usuario['address']['street'];
            $cidade = $usuario['address']['city'];
        }
    } 
   else 
    {
        echo "<script>alert('Usuário não encontrado!');</script>";
    }
}
?>
